
<!DOCTYPE html>

    <style>
    button {
      background-color:   #007BFF;
      color:  White;
      padding:  10px 20px;
      border-radius:  5px;
      transition:   background-color  0.3s ease, color 0.3s ease;
    }
    button:hover{
      background-color:   #0056b3;
      color: #ffcc00

    button{

    }

    </style>
